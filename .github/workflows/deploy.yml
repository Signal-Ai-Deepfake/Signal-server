name: CD

# main에 push되면 GitHub 러너에서 이미지를 빌드해 GHCR에 올리고, 서버는 그 이미지를 pull만 한다.
# 서버가 1 vCPU / 2GB라서 서버에서 직접 빌드하면 배포 중 API가 응답 불능이 될 수 있어 이렇게 분리했다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_schema_update:
        description: '엔티티에 컬럼/테이블이 추가된 배포면 체크 (ddl-auto=update로 스키마 선반영)'
        type: boolean
        default: false

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/signal-ai-deepfake/signal-server

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 테스트 실행
        run: ./gradlew test --no-daemon

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
          if-no-files-found: ignore

  build:
    name: 빌드
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # PR에서는 빌드만 검증하고 push하지 않는다.
      - name: GHCR 로그인
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 (main이면 push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 배포
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH 키 준비
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 서버 배포
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          DEPLOY_SHA: ${{ github.sha }}
          RUN_SCHEMA_UPDATE: ${{ inputs.run_schema_update || false }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes \
              "$SSH_USER@$SSH_HOST" \
              "cd ~/signal-server \
               && git fetch --quiet origin main \
               && git reset --hard --quiet '$DEPLOY_SHA' \
               && APP_IMAGE='$APP_IMAGE' \
                  GHCR_USER='$GHCR_USER' \
                  GHCR_TOKEN='$GHCR_TOKEN' \
                  RUN_SCHEMA_UPDATE='$RUN_SCHEMA_UPDATE' \
                  bash scripts/remote-deploy.sh"

      # 서버 안에서의 헬스체크는 remote-deploy.sh가 이미 했다. 여기서는 게이트웨이까지 포함한
      # 실제 사용자 경로를 확인한다.
      - name: 공개 URL 확인
        run: |
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors \
               -o /dev/null -w '%{http_code}\n' https://signal.https.gsmsv.site/health

      - name: 요약
        if: always()
        run: |
          {
            echo "### 배포 결과"
            echo ""
            echo "- 이미지: \`${{ env.IMAGE }}:${{ github.sha }}\`"
            echo "- 공개 URL: https://signal.https.gsmsv.site"
            echo "- 스키마 반영: \`${{ inputs.run_schema_update || false }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
