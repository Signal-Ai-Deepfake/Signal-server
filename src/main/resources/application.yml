spring:
  application:
    name: signal-server

  profiles:
    active: local

  flyway:
    enabled: false   # local/test는 ddl-auto로 스키마를 만들므로 Flyway는 prod에서만 사용

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    defer-datasource-initialization: true   # data.sql이 Hibernate 스키마 생성/검증 이후에 실행되도록 함

  sql:
    init:
      mode: always   # MySQL 등 임베디드가 아닌 DB에서도 data.sql 시드가 실행되도록 함

  servlet:
    multipart:
      max-file-size: 100MB      # 딥페이크 탐지의 영상 업로드를 지원하기 위해 상향 (이미지 전용 API는 서비스 레벨에서 10MB로 별도 제한)
      max-request-size: 110MB

  http:
    client:
      connect-timeout: 5s   # 외부 AI(LLM) API 호출 등 아웃바운드 HTTP 공통 타임아웃
      read-timeout: 10s

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}   # Gmail 주소
    password: ${SMTP_PASS:}   # Gmail 앱 비밀번호 (2단계 인증 → 앱 비밀번호 발급)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000

verification:
  code-expiration: 300000    # 인증번호 유효시간 5분 (ms)
  token-expiration: 600000   # 인증 토큰 유효시간 10분 (ms)

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 3600000      # 1시간 (ms)
  refresh-token-expiration: 1209600000  # 14일 (ms)

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}   # 로컬 저장 경로 (추후 S3 교체 가능)
  base-url: ${FILE_BASE_URL:/uploads}      # 파일 접근 URL prefix

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://signal-web-rho.vercel.app,http://localhost:3000}

protection:
  mode: ${PROTECTION_MODE:noise}   # noise: 서버 내 픽셀 노이즈 삽입(NoiseImageProtector, 기본) / http: protection-lab 서비스 호출(모델 겨냥 적대적 노이즈)
  http:
    base-url: ${PROTECTION_API_URL:http://localhost:8000}
    timeout-seconds: ${PROTECTION_API_TIMEOUT_SECONDS:300}   # 노이즈 계산은 CPU에서 수 분까지 걸릴 수 있음

monitoring:
  mode: ${MONITORING_MODE:stub}   # stub: 시연용 예시 결과(StubFaceMonitor, 기본) / search: 웹 역이미지 검색을 하루 1회 수행(SearchFaceMonitor)
  processing-delay-ms: 3000   # stub 모드의 탐지 시뮬레이션 지연
  search:   # mode=search
    interval-hours: ${MONITORING_SEARCH_INTERVAL_HOURS:24}   # 모니터링 하나를 다시 검색하는 간격
    daily-limit: ${MONITORING_SEARCH_DAILY_LIMIT:30}         # 하루 전체 검색 상한. Vision 무료 쿼터(월 1,000건)를 넘지 않도록 30건 안팎
    max-failures: ${MONITORING_SEARCH_MAX_FAILURES:5}        # 연속 실패가 이 횟수에 이르면 PAUSED
    timeout-seconds: ${MONITORING_SEARCH_TIMEOUT_SECONDS:30}
    cron: ${MONITORING_SEARCH_CRON:0 0 * * * *}              # 검색 시각이 지난 모니터링을 찾는 주기(매시 정각)
    google-vision:
      api-key: ${GOOGLE_VISION_API_KEY:}                     # mode=search일 때 필수

web-search:   # 탐지한 사진이 웹 어딘가에 올라와 있는지 역이미지 검색(탐지 결과의 "얼굴 도용 여부" 카드)
  provider: ${WEB_SEARCH_PROVIDER:none}   # none: 끔(기본, webSearch=null) / serpapi: SerpApi Google Lens. 켜면 얼굴 사진이 외부로 전송된다
  # SerpApi 무료 플랜은 월 250건이다. 사용자별 하루 → 전체 하루 → 전체 한 달 순서로 막아 한도를 넘지 않게 한다.
  owner-daily-limit: ${WEB_SEARCH_OWNER_DAILY_LIMIT:2}   # 사용자(비로그인은 익명 id)당 하루 검색 상한
  daily-limit: ${WEB_SEARCH_DAILY_LIMIT:8}               # 하루 전체 검색 상한(250/30일)
  monthly-limit: ${WEB_SEARCH_MONTHLY_LIMIT:240}         # 이번 달 전체 상한. 250에서 여유 10건을 남긴다
  public-base-url: ${WEB_SEARCH_PUBLIC_BASE_URL:}   # SerpApi가 임시 이미지를 가져갈 이 서버의 외부 주소(https://...)
  temp-image-ttl-seconds: 90   # 검색 타임아웃(60초)보다 조금만 길게
  retention-days: ${WEB_SEARCH_RETENTION_DAYS:30}   # 검색 결과 보존 기간. 지나면 삭제한다
  timeout-seconds: ${WEB_SEARCH_TIMEOUT_SECONDS:60}
  serpapi:
    api-key: ${SERPAPI_API_KEY:}

deepfake-detection:
  mode: ${DEEPFAKE_DETECTION_MODE:llm}   # llm: 비전 LLM(LlmDeepfakeDetector, 기본) / http: detect-lab 서비스의 전용 탐지 모델 호출(HttpDeepfakeDetector)
  processing-delay-ms: 3000   # 딥페이크 탐지 시뮬레이션 지연 (스텁, 추후 AI 서버 연동 시 제거)
  http:
    base-url: ${DEEPFAKE_DETECTION_API_URL:http://localhost:8000}
    timeout-seconds: ${DEEPFAKE_DETECTION_API_TIMEOUT_SECONDS:60}
  bands:   # mode=http의 합성 가능성 등급. 기본값은 기존 verdict 구간을 옮긴 잠정값이며, 평가 세트(#35) 결과로 정한다
    low-below: ${DEEPFAKE_BAND_LOW_BELOW:30}         # 점수(0~100)가 이 값 미만이면 낮음
    high-above: ${DEEPFAKE_BAND_HIGH_ABOVE:70}       # 이 값 초과면 높음, 그 사이는 불확실
    min-short-edge-px: ${DEEPFAKE_BAND_MIN_SHORT_EDGE_PX:256}   # 짧은 변이 이보다 작으면 판단 불가
  explain:
    enabled: ${DEEPFAKE_EXPLAIN_ENABLED:false}   # true면 비전 LLM이 이미 정해진 등급을 설명한다(등급은 바꾸지 못함)

chat:
  llm:
    enabled: ${CHAT_LLM_ENABLED:true}                     # false면 룰 기반(RuleBasedChatEngine) 답변만 사용
    api-key: ${GROQ_API_KEY:}                             # 비어있으면 자동으로 룰 기반 응답으로 폴백 (앱은 정상 구동됨)
    base-url: ${CHAT_LLM_BASE_URL:https://api.groq.com/openai/v1}   # Groq는 OpenAI 호환 API 제공 (무료 티어, https://console.groq.com)
    model: ${CHAT_LLM_MODEL:openai/gpt-oss-120b}           # Groq에서 llama-3.3-70b-versatile 등이 폐기(2026-08-16)되며 대체된 범용 모델
    max-completion-tokens: ${CHAT_LLM_MAX_TOKENS:1024}   # gpt-oss는 추론 토큰도 이 상한에 포함되어 400이면 답변이 잘린다
    reasoning-effort: ${CHAT_LLM_REASONING_EFFORT:low}      # gpt-oss의 추론량(low/medium/high). 추론을 지원하지 않는 모델로 바꾸면 비워 둔다

vision:
  llm:
    enabled: ${VISION_LLM_ENABLED:true}                   # false면 위험도분석/딥페이크탐지 둘 다 룰 기반 결과만 사용
    model: ${VISION_LLM_MODEL:qwen/qwen3.8-27b}            # Groq의 비전(이미지 입력) 지원 모델 (qwen3.6-27b는 2026-09-14 종료) (chat.llm과 같은 GROQ_API_KEY 사용)
    max-completion-tokens: ${VISION_LLM_MAX_TOKENS:2048}
    read-timeout-seconds: ${VISION_LLM_READ_TIMEOUT_SECONDS:60}   # 이미지 분석은 응답이 길어 전역 read-timeout(10초)과 별도로 둔다

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://localhost:3306/signal?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true   # 기존 운영 DB(Hibernate로 생성됨)는 V1을 기준선으로 보고 V2부터 적용
    baseline-version: 1

  jpa:
    defer-datasource-initialization: false   # true면 Flyway와 entityManagerFactory가 순환 의존해 기동 실패. 운영 DB는 테이블이 이미 있어 data.sql을 먼저 실행해도 안전
    hibernate:
      ddl-auto: validate
