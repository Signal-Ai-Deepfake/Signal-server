services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: signal
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    # CD는 GHCR에 미리 빌드된 이미지를 APP_IMAGE로 주입한다.
    # 값이 없으면 :main 태그를 쓰고, 로컬에서는 `docker compose build app`으로 직접 빌드해도 된다.
    image: ${APP_IMAGE:-ghcr.io/signal-ai-deepfake/signal-server:main}
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "80:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/signal?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      CORS_ALLOWED_ORIGINS: https://signal-web-rho.vercel.app,http://localhost:3000
      PROTECTION_MODE: ${PROTECTION_MODE:-noise}          # http로 바꾸면 protection 서비스(노이즈 삽입)를 호출
      PROTECTION_API_URL: http://protection:8000
    volumes:
      - uploads-data:/app/uploads

  # 실험용 이미지 보호 서비스. 기본 배포에는 포함되지 않으며 `docker compose --profile protection up -d` 로 켠다.
  protection:
    profiles: ["protection"]
    build: ./protection-lab
    restart: unless-stopped
    volumes:
      - model-cache:/models

volumes:
  mysql-data:
  uploads-data:
  model-cache:
